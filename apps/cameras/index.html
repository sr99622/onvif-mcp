<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Switchboard</title>
  <link rel="stylesheet" href="/cameras/styles.css?v=10">
</head>
<body>
  <main class="app">
    <button
      id="sidebar-toggle"
      class="sidebar-toggle"
      type="button"
      aria-controls="sidebar"
      aria-expanded="true"
      title="Collapse controls"
    >
      <span aria-hidden="true">‹</span>
      <span class="visually-hidden">Collapse controls</span>
    </button>

    <aside id="sidebar" class="sidebar">
      <header>
        <p class="eyebrow">LIVE VIEW</p>
        <h1>Camera Switchboard</h1>
        <p id="status" class="status">Loading cameras…</p>
      </header>

      <nav id="camera-list" class="camera-list" aria-label="Cameras"></nav>

      <div class="controls">
        <a class="multiview-link" href="/multiview/?v=11">Multi View</a>
      </div>
    </aside>

    <section class="viewer">
      <div class="viewer-header">
        <div>
          <p class="eyebrow">NOW VIEWING</p>
          <h2 id="camera-name">Select a camera</h2>
        </div>
        <span id="camera-address" class="address"></span>
      </div>
      <iframe
        id="player"
        title="Camera live stream"
        allow="autoplay; fullscreen"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>
  <script src="/cameras/app.js?v=10"></script>
</body>
</html>
