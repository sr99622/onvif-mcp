[project]
name = "onvif-mcp-http"
version = "0.0.8"
description = "ONVIF MCP server using the streamable-http transport"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "libonvif==4.0.23",
    "pydantic>=2.0.0",
    "niquests",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

# TEMPORARY: pointing libonvif at the local source directory, matching the
# same pattern used in the camera MCP server, since we're not certain the
# libonvif version this depends on is published to PyPI yet.
#[tool.uv.sources]
#libonvif = { path = "../libonvif" }
